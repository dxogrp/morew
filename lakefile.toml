name = "morew"
version = "0.3.0"
defaultTargets = ["Morew", "MorewTest", "Examples"]
requiresModuleSystem = true
lintDriver = "batteries/runLinter"
lintDriverArgs = ["Morew"]

[[lean_lib]]
name = "Morew"

[[lean_lib]]
name = "MorewTest"

[[lean_lib]]
name = "Examples"

[[lean_lib]]
name = "KernelCheck"
srcDir = "scripts"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.36.0"
