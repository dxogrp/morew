name = "morew"
version = "0.1.0"
defaultTargets = ["Morew", "MorewTest"]
lintDriver = "batteries/runLinter"
lintDriverArgs = ["Morew"]
# Compile each Morew module with one worker; Lake schedules modules in parallel.
weakLeanArgs = ["-j1"]

[[lean_lib]]
name = "Morew"

[[lean_lib]]
name = "MorewTest"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.33.0"
