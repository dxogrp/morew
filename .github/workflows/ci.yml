name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Cache PTran build artifacts
        uses: actions/cache@v5
        with:
          path: .lake/build
          key: ptran-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            ptran-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Build Lean libraries
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: "--wfail"
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false

      - name: Lint PTran
        if: matrix.os == 'ubuntu-latest'
        run: lake lint

      - name: Verify compiled modules with leanchecker
        if: matrix.os == 'ubuntu-latest'
        env:
          LEAN_NUM_THREADS: "1"
        run: lake env leanchecker PTran PTranTest
