name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build Lean libraries
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: "--wfail"
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: true

      - name: Verify compiled modules with leanchecker
        if: matrix.os == 'ubuntu-latest'
        env:
          LEAN_NUM_THREADS: "1"
        run: lake env leanchecker PTran PTranTest
