name: Release candidate

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: morew-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require main and successful CI for this commit
        id: prerequisites
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B scripts/verify_release.py candidate

      - name: Set up Lean and fetch Mathlib artifacts
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: true
          use-github-cache: false

      - name: Build fresh project artifacts
        run: |
          lake clean morew
          lake build --wfail

      - name: Check aggregate imports and lint
        run: |
          lake exe mk_all --check
          lake check-lint
          lake lint

      - name: Test release verification
        run: python3 -B -m unittest discover -s scripts/tests -v

      - name: Verify all project modules with leanchecker
        env:
          LEAN_NUM_THREADS: "1"
        run: |
          /usr/bin/time -v -o "$RUNNER_TEMP/morew-kernel-time.txt" \
            lake env leanchecker Morew MorewTest Examples

      - name: Summarize kernel-check measurements
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/morew-kernel-time.txt" ]; then
            {
              echo '### Kernel-check measurements'
              echo
              echo '```text'
              cat "$RUNNER_TEMP/morew-kernel-time.txt"
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Summarize verified release candidate
        env:
          PACKAGE_VERSION: ${{ steps.prerequisites.outputs.package_version }}
          SOURCE_SHA: ${{ steps.prerequisites.outputs.source_sha }}
        run: |
          {
            echo '### Verified release candidate'
            echo
            printf 'Version: `%s`\n\n' "$PACKAGE_VERSION"
            printf 'Source commit: `%s`\n\n' "$SOURCE_SHA"
            printf 'Create tag `v%s` at exactly `%s`.\n' "$PACKAGE_VERSION" "$SOURCE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
